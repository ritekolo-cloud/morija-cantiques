services:
  # ─────────────────────────────────────────────────────────────────────────────
  # Unified Node.js Web Service
  # The backend Express server (port 5000) serves BOTH the API (/api/*)
  # AND the compiled React SPA (frontend/dist) in production.
  # This avoids needing a second service and keeps things on the free plan.
  # ─────────────────────────────────────────────────────────────────────────────
  - type: web
    name: morija-cantiques
    runtime: node
    plan: free
    repo: https://github.com/ritekolo-cloud/morija-cantiques
    # Build: install deps → generate Prisma client → build TS + React
    #        → run migrations → import hymns (idempotent upsert, safe to repeat)
buildCommand: >-
  npm install --include=dev &&
  npx prisma generate --schema=backend/prisma/schema.prisma &&
  npm run build

startCommand: >-
  npx prisma migrate deploy --schema=backend/prisma/schema.prisma &&
  node backend/scripts/import-hymns.mjs &&
  npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # ── Runtime ──────────────────────────────────────────────────
      - key: NODE_ENV
        value: production

      # ── Database ─────────────────────────────────────────────────
      - key: DATABASE_URL
        fromDatabase:
          name: morija-db
          property: connectionString

      # ── JWT ──────────────────────────────────────────────────────
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d

      # ── CORS / URLs ──────────────────────────────────────────────
      - key: CLIENT_URL
        value: https://morija-cantiques-ax20.onrender.com
      - key: CORS_ORIGIN
        value: https://morija-cantiques-ax20.onrender.com

      # ── Security ─────────────────────────────────────────────────
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "100"

      # ── Logging ──────────────────────────────────────────────────
      - key: LOG_LEVEL
        value: info

      # ── Admin Account ────────────────────────────────────────────
      - key: ADMIN_NAME
        value: Administrator
      - key: ADMIN_EMAIL
        value: admin@morijacantiques.com
      - key: ADMIN_PASSWORD
        generateValue: true

      # ── SMTP (set manually in Render dashboard if needed) ────────
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: "Morija-Cantiques <noreply@morijacantiques.com>"

# ─────────────────────────────────────────────────────────────────────────────
# PostgreSQL Database (free tier — 1 GB storage)
# ─────────────────────────────────────────────────────────────────────────────
databases:
  - name: morija-db
    plan: free
