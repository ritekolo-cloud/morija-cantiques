services:
  - type: web
    name: morija-cantiques-preview
    runtime: node
    plan: free
    repo: https://github.com/ritekolo-cloud/morija-cantiques
    branch: codex/preview-both-projection
    buildCommand: >-
      npm install --include=dev &&
      npx prisma generate --schema=backend/prisma/schema.prisma &&
      npm run build
    startCommand: >-
      npx prisma migrate deploy --schema=backend/prisma/schema.prisma &&
      node backend/scripts/import-hymns.mjs &&
      npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: morija-cantiques-preview-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        value: https://morija-cantiques-preview.onrender.com
      - key: CORS_ORIGIN
        value: https://morija-cantiques-preview.onrender.com
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "100"
      - key: LOG_LEVEL
        value: info
      - key: MEDIA_STORAGE_PROVIDER
        value: unconfigured
      - key: ADMIN_NAME
        value: Administrator
      - key: ADMIN_EMAIL
        value: admin@morijacantiques.com
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: "Morija-Cantiques <noreply@morijacantiques.com>"

databases:
  - name: morija-cantiques-preview-db
    plan: free
